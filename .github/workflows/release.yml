name: Release

# A version tag builds, packages and publishes the release. Pull requests that
# touch the release machinery, and manual runs, build and check every package
# the same way but publish nothing: only the last job uploads, and only for a tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "rust-toolchain.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runner of each architecture, so the binary
          # runs on Ubuntu 22.04 (glibc 2.35) and newer.
          - arch: x86_64
            deb: amd64
            runner: ubuntu-22.04
            file: x86-64
          - arch: aarch64
            deb: arm64
            runner: ubuntu-22.04-arm
            file: ARM aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=${GITHUB_REF_NAME#v}
          else
            v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p gearwise
      - name: Package
        run: |
          mkdir -p dist
          packaging/linux/build-deb.sh target/release/gearwise "$VERSION" dist
          t=gearwise-$VERSION-linux-${{ matrix.arch }}
          mkdir -p "$t/icons"
          cp target/release/gearwise README.md LICENSE CHANGELOG.md "$t/"
          cp packaging/linux/70-gearwise.rules packaging/linux/install-udev-rules.sh packaging/linux/gearwise.desktop "$t/"
          cp packaging/icons/*.png "$t/icons/"
          tar -czf "dist/$t.tar.gz" "$t"
          ls -l dist
      - name: Check the packages are ${{ matrix.arch }}
        run: |
          deb=dist/gearwise_${VERSION}_${{ matrix.deb }}.deb
          tgz=dist/gearwise-$VERSION-linux-${{ matrix.arch }}.tar.gz
          test -f "$deb" && test -f "$tgz"
          test "$(dpkg-deb -f "$deb" Architecture)" = ${{ matrix.deb }}
          mkdir "$RUNNER_TEMP/unpacked"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/unpacked"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/unpacked"
          for b in "$RUNNER_TEMP/unpacked/usr/bin/gearwise" "$RUNNER_TEMP/unpacked/gearwise-$VERSION-linux-${{ matrix.arch }}/gearwise"; do
            file "$b"
            file "$b" | grep -q '${{ matrix.file }}'
          done
      - name: Install the .deb and start the app
        # The package's dependencies must resolve on this architecture, and the
        # installed program must run (the screenshot tour draws the real UI).
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/gearwise_${VERSION}_${{ matrix.deb }}.deb xvfb libgl1-mesa-dri
          gearwise --version
          shots="$RUNNER_TEMP/shots"
          xvfb-run -a gearwise --screenshot "$shots" --only 03-sensitivity
          test -s "$shots/03-sensitivity.png"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            machine: '0x8664'
          # Built natively on Windows 11 on ARM.
          - arch: aarch64
            runner: windows-11-arm
            machine: '0xAA64'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = "$env:GITHUB_REF_NAME".TrimStart('v') }
          else { $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value }
          "VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Install rustup (the ARM image has none)
        if: runner.arch == 'ARM64'
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $init = "$env:RUNNER_TEMP\rustup-init.exe"
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe" -OutFile $init
            & $init -y --default-toolchain none --profile minimal
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p gearwise
      - name: Package
        shell: pwsh
        run: |
          $t = "gearwise-$env:VERSION-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "$t", dist | Out-Null
          Copy-Item target/release/gearwise.exe, README.md, LICENSE, CHANGELOG.md "$t/"
          Compress-Archive -Path "$t/*" -DestinationPath "dist/$t.zip"
      - name: Check the program is native to this machine
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes("target\release\gearwise.exe")
          $machine = [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3C) + 4)
          "gearwise.exe machine type: 0x{0:X4}" -f $machine
          if ($machine -ne ${{ matrix.machine }}) { throw ("gearwise.exe is machine 0x{0:X4}, expected ${{ matrix.machine }}" -f $machine) }
          # What is in the zip is what runs: unpack it and start it.
          Expand-Archive "dist/gearwise-$env:VERSION-windows-${{ matrix.arch }}.zip" -DestinationPath "$env:RUNNER_TEMP\unzipped"
          $p = Start-Process "$env:RUNNER_TEMP\unzipped\gearwise.exe" -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "gearwise.exe --version exited with $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Repackages each architecture's .deb for Fedora/RHEL/openSUSE (.rpm), Arch
  # (.pkg.tar.zst) and any glibc distribution (AppImage), so every format
  # ships the same binary, then installs each one on the real distribution
  # and runs the screenshot tour there. No Flatpak: the sandbox cannot install
  # the udev rule the devices need, would need --device=all anyway, and hides
  # host processes, so per-application profiles could not work.
  distros:
    name: rpm + Arch + AppImage ${{ matrix.arch }}
    needs: [linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, deb: amd64, nfpm_arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, deb: arm64, nfpm_arch: arm64, runner: ubuntu-24.04-arm }
    env:
      NFPM_VERSION: '2.48.0'
      APPIMAGETOOL_VERSION: '1.9.1'
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=${GITHUB_REF_NAME#v}
          else
            v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: deb
      - name: Install nfpm and appimagetool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          tarball="nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm_arch }}.tar.gz"
          gh release download "v$NFPM_VERSION" -R goreleaser/nfpm -p "$tarball" -p checksums.txt
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" nfpm
          gh release download "$APPIMAGETOOL_VERSION" -R AppImage/appimagetool \
            -p "appimagetool-${{ matrix.arch }}.AppImage" -O appimagetool
          chmod +x appimagetool
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build .rpm, Arch package and AppImage
        run: |
          dpkg-deb -x "deb/gearwise_${VERSION}_${{ matrix.deb }}.deb" "$RUNNER_TEMP/root"
          packaging/linux-distros/pack.sh "$RUNNER_TEMP/root" ${{ matrix.deb }} dist
      - name: Install and run on Fedora, openSUSE and Arch
        run: packaging/linux-distros/verify.sh dist ${{ matrix.deb }}
      - uses: actions/upload-artifact@v4
        with:
          name: distros-${{ matrix.arch }}
          path: |
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
          if-no-files-found: error

  # AUR recipe: PKGBUILD + .SRCINFO + gearwise.install for gearwise-bin,
  # rendered with this build's checksums and proven with makepkg on
  # archlinux:latest.
  aur:
    name: AUR PKGBUILD
    needs: [linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=${GITHUB_REF_NAME#v}
          else
            v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: debs
          merge-multiple: true
      - name: Render and check the PKGBUILD
        run: packaging/arch/aur.sh "debs/gearwise_${VERSION}_amd64.deb" "debs/gearwise_${VERSION}_arm64.deb" dist
      - uses: actions/upload-artifact@v4
        with:
          name: aur
          path: dist/*-aur.tar.gz
          if-no-files-found: error

  checksums:
    name: release notes and SHA256SUMS
    needs: [linux, windows, distros, aur]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=${GITHUB_REF_NAME#v}
          else
            v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Every platform delivered its package
        run: |
          ls -l dist
          for f in \
            gearwise-$VERSION-linux-x86_64.tar.gz gearwise-$VERSION-linux-aarch64.tar.gz \
            gearwise_${VERSION}_amd64.deb gearwise_${VERSION}_arm64.deb \
            gearwise-$VERSION-windows-x86_64.zip gearwise-$VERSION-windows-aarch64.zip \
            gearwise-$VERSION-1.x86_64.rpm gearwise-$VERSION-1.aarch64.rpm \
            gearwise-$VERSION-1-x86_64.pkg.tar.zst gearwise-$VERSION-1-aarch64.pkg.tar.zst \
            Gearwise-$VERSION-x86_64.AppImage Gearwise-$VERSION-aarch64.AppImage \
            gearwise-bin-$VERSION-aur.tar.gz; do
            test -f "dist/$f" || { echo "missing $f"; exit 1; }
          done
          test "$(ls dist | wc -l)" -eq 13
      - name: Release notes from the changelog
        run: |
          mkdir meta
          awk -v v="$VERSION" '$0 ~ "^## " v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > meta/notes.md
          cat >> meta/notes.md <<'MD'

          ### Install

          - **Ubuntu (PPA):** `sudo add-apt-repository ppa:dhiva-labs/apps && sudo apt install gearwise`
          - **Debian/Ubuntu (.deb):** download `gearwise_*_amd64.deb` (x86-64) or `gearwise_*_arm64.deb` (Arm64) below and `sudo apt install ./gearwise_*.deb`
          - **Fedora/RHEL (.rpm):** `sudo dnf install ./gearwise-*.x86_64.rpm` (or `.aarch64.rpm`); **openSUSE:** `sudo zypper install --allow-unsigned-rpm ./gearwise-*.x86_64.rpm`
          - **Arch (.pkg.tar.zst):** `sudo pacman -U ./gearwise-*-x86_64.pkg.tar.zst` (or `-aarch64`); the AUR recipe for `gearwise-bin` is in `gearwise-bin-*-aur.tar.gz`
          - **AppImage (any glibc 2.35+ Linux):** `chmod +x Gearwise-*-x86_64.AppImage && ./Gearwise-*-x86_64.AppImage` (or `-aarch64`); install the udev rule once with `install-udev-rules.sh` from the tarball
          - **Any Linux:** extract `gearwise-*-linux-x86_64.tar.gz` or `gearwise-*-linux-aarch64.tar.gz`, run `sudo ./install-udev-rules.sh` once, then `./gearwise`
          - **Windows:** extract `gearwise-*-windows-x86_64.zip` (most PCs) or `gearwise-*-windows-aarch64.zip` (Windows on Arm) and run `gearwise.exe` (close G HUB / Synapse / iCUE / GG first)
          MD
      - name: Checksums
        run: cd dist && sha256sum * | tee ../meta/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: meta/*
          if-no-files-found: error

  publish:
    name: publish the release
    if: github.ref_type == 'tag'
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv dist/notes.md notes.md
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --title "Gearwise ${GITHUB_REF_NAME#v}" --notes-file notes.md
