[workspace]
resolver = "3"
members = [
    "crates/periph-core",
    "crates/periph-hid",
    "crates/periph-logitech",
    "crates/periph-razer",
    "crates/periph-corsair",
    "crates/periph-input",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Dhiva-Labs/periph-studio"
rust-version = "1.85"

[workspace.dependencies]
periph-core = { path = "crates/periph-core" }
periph-hid = { path = "crates/periph-hid" }
periph-logitech = { path = "crates/periph-logitech" }
periph-razer = { path = "crates/periph-razer" }
periph-corsair = { path = "crates/periph-corsair" }
periph-input = { path = "crates/periph-input" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
