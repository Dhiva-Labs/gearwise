# Package metadata for the other-distribution packages (.rpm, Arch package,
# AppImage, AUR PKGBUILD). Sourced by bash from
# packaging/linux-distros/pack.sh, verify.sh and packaging/arch/aur.sh. All of
# them repackage the .deb that packaging/linux/build-deb.sh builds; keep this
# in step with it.

NAME=gearwise
APP_NAME=Gearwise
GITHUB_REPO=Dhiva-Labs/gearwise
TAG_PREFIX=v
SUMMARY='Configure gaming mice and keyboards'
DESCRIPTION='Gearwise configures mice and keyboards from Logitech, Razer, Corsair and SteelSeries: DPI stages, report rate, RGB lighting (zones and per-key), button assignments, onboard profiles, macros and per-application profiles, in one lightweight native app. A udev rule is installed so the logged-in user can open the devices and /dev/uinput (for macros) without root.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/gearwise
LICENSE=MIT
LICENSE_FILE=LICENSE

# The binary links only libc, libm and libgcc_s; winit, glutin and
# xkbcommon-dl dlopen() the display and GL libraries, so the ELF scan in
# pack.sh cannot see them. These are the sonames the binary loads (the .deb
# lists them in Depends: by hand for the same reason).
RPM_REQUIRES=(
  'libEGL.so.1()(64bit)' 'libGL.so.1()(64bit)'
  'libX11.so.6()(64bit)' 'libX11-xcb.so.1()(64bit)' 'libxcb.so.1()(64bit)'
  'libXcursor.so.1()(64bit)' 'libXi.so.6()(64bit)' 'libXrender.so.1()(64bit)'
  'libxkbcommon.so.0()(64bit)' 'libxkbcommon-x11.so.0()(64bit)'
  'libwayland-client.so.0()(64bit)' 'libwayland-egl.so.1()(64bit)'
)
ARCH_DEPENDS=(glibc gcc-libs libglvnd libx11 libxcb libxcursor libxi libxrender
  libxkbcommon libxkbcommon-x11 wayland)
ARCH_INDEPENDENT=0

# The udev rule in /usr/lib/udev/rules.d gives the console user access to
# the devices and /dev/uinput; reload it and apply it to devices that are
# already plugged in, as the .deb's postinst does.
POSTINSTALL=udev-reload.sh
POSTREMOVE=udev-reload.sh

APPIMAGE=1
EXEC=usr/bin/gearwise
DESKTOP=usr/share/applications/gearwise.desktop
ICON=usr/share/icons/hicolor/256x256/apps/gearwise.png
APPRUN_ENV=''

# Smoke tests run in each distribution container by verify.sh. SMOKE_CMD is
# the release workflow's own check: the screenshot tour draws the real UI
# with demo devices and must write the PNG. GUI_CMD must then still be
# running after SMOKE_SECONDS under Xvfb.
CMD=gearwise
SMOKE_CMD='"$APP" --version && xvfb-run -a -s "-screen 0 1280x800x24" "$APP" --screenshot /tmp/shots --only 03-sensitivity && test -s /tmp/shots/03-sensitivity.png'
GUI_CMD=gearwise
SMOKE_SECONDS=20
# A GL driver for Xvfb (any desktop has one; the containers do not).
SMOKE_PKGS_DNF=(mesa-libEGL mesa-libGL)
SMOKE_PKGS_SUSE=(Mesa-libEGL1 Mesa-libGL1)
SMOKE_PKGS_ARCH=()
# What the AppImage takes from the host: the libraries above.
APPIMAGE_HOST_PKGS_DNF=(mesa-libEGL mesa-libGL libX11 libX11-xcb libxcb libXcursor
  libXi libXrender libxkbcommon libxkbcommon-x11 libwayland-client libwayland-egl)
