name: gearwise
title: Gearwise
version: "0.1.0"
summary: Configure Logitech, Razer, Corsair and SteelSeries mice and keyboards
description: |
  Gearwise is a lightweight native app for gaming mice and keyboards from
  Logitech, Razer, Corsair and SteelSeries: DPI stages, report rate up to
  8 kHz, RGB lighting (zones and per-key), button assignments, onboard
  profiles, macros and per-application profiles. Supported mice are drawn
  as they look, with every button labelled where it is.

  **One-time setup.** The app talks to the devices' HID interfaces
  (/dev/hidraw*) and plays macros through /dev/uinput, which needs a udev
  rule granting your user access and two interface connections:

      sudo cp /snap/gearwise/current/udev/70-gearwise.rules /etc/udev/rules.d/
      sudo udevadm control --reload-rules && sudo udevadm trigger
      sudo snap connect gearwise:hidraw-devices gearwise:hidraw
      sudo snap connect gearwise:uinput
      sudo snap connect gearwise:hardware-observe

  Graphics come from the mesa-2404 snap, installed automatically.

  Then unplug and replug your devices. Close G HUB, Synapse, iCUE or GG if
  they run in a VM or Wine prefix.
website: https://github.com/Dhiva-Labs/gearwise
source-code: https://github.com/Dhiva-Labs/gearwise
issues: https://github.com/Dhiva-Labs/gearwise/issues
license: MIT
icon: snap/gui/gearwise.png
base: core24
grade: stable
confinement: strict
platforms:
  amd64:

apps:
  gearwise:
    command: bin/gearwise
    # Mesa from the mesa-2404 content snap (gpu-2404 interface).
    command-chain: [bin/gpu-2404-wrapper]
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
      XKB_CONFIG_ROOT: $SNAP/usr/share/X11/xkb
      XCURSOR_PATH: $SNAP/usr/share/icons
    plugs:
      - wayland
      - x11
      - desktop
      - hidraw-devices
      - uinput
      - hardware-observe

plugs:
  gpu-2404:
    interface: content
    target: $SNAP/gpu-2404
    default-provider: mesa-2404
  # Raw access to the mice/keyboards' HID interfaces. Paired with the slot
  # below; needs a store declaration (see packaging/SNAP.md).
  hidraw-devices:
    interface: custom-device
    custom-device: gearwise-hidraw

slots:
  hidraw:
    interface: custom-device
    custom-device: gearwise-hidraw
    devices:
      - /dev/hidraw*
    udev-tagging:
      - kernel: hidraw*
        subsystem: hidraw

layout:
  /usr/share/libdrm:
    bind: $SNAP/gpu-2404/libdrm
  /usr/share/drirc.d:
    symlink: $SNAP/gpu-2404/drirc.d
  /usr/share/X11/XErrorDB:
    symlink: $SNAP/gpu-2404/X11/XErrorDB

parts:
  gearwise:
    # Built with the pinned toolchain from rust-toolchain.toml, installed by
    # rustup-init: the rust plugin's rustup integration is fragile in
    # managed builds.
    plugin: nil
    # Committed files only (not the local target/ directory).
    source: .
    source-type: git
    build-packages:
      - curl
      - gcc
      - pkg-config
    override-build: |
      export RUSTUP_HOME="$CRAFT_PART_BUILD/.rustup" CARGO_HOME="$CRAFT_PART_BUILD/.cargo"
      export RUSTUP_TOOLCHAIN=1.97.1
      curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN" --no-modify-path
      "$CARGO_HOME/bin/cargo" build --release --locked -p gearwise
      install -Dm755 target/release/gearwise "$CRAFT_PART_INSTALL/bin/gearwise"
    # Loaded at runtime by winit/glutin (X11 or Wayland, EGL/GLX via glvnd).
    stage-packages:
      - libegl1
      - libgl1
      - libglvnd0
      - libglx0
      - libopengl0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - xkb-data
      - dmz-cursor-theme

  extras:
    plugin: dump
    source: packaging/linux
    organize:
      70-gearwise.rules: udev/70-gearwise.rules
    stage:
      - udev/70-gearwise.rules

  gpu-2404:
    after: [gearwise]
    source: https://github.com/canonical/gpu-snap.git
    plugin: dump
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/gpu-2404-cleanup mesa-2404
    prime:
      - bin/gpu-2404-wrapper
